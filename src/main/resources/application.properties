
# === Application ===
spring.application.name=IdentityService

# === Server Port ===
server.port=8082

# === PostgreSQL Database Configuration ===
# Local: localhost:5432
# Docker: identity-postgres:5432

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identityservice_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === JWT Configuration ===
# JWT_SECRET must be at least 32 characters.
# Use the SAME secret in all microservices.

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_THE_SAME_SECRET_AS_IDENTITY_SERVICE}
app.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# === Bootstrap Admin ===
# Created at startup only if email AND password are configured.

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# === Technical Account for Microservices ===
# Role: SERVICE
# Created at startup if both email and password are configured.

app.service-account.email=${SERVICE_ACCOUNT_EMAIL:}
app.service-account.password=${SERVICE_ACCOUNT_PASSWORD:}

# === CORS Configuration ===
# Browser origins allowed to call this API.

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:58020}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
