spring.application.name=IdentityService
server.port=8082

# --- Database ---
# Password is NOT here: set SPRING_DATASOURCE_PASSWORD (env var / K8s Secret / GitLab CI variable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identityservice_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT --- (JWT_SECRET: at least 32 characters, required, never commit it)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# --- Bootstrap admin (created at startup only if email AND password are set) ---
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Technical account for the microservices (role SERVICE, created at startup if both are set) ---
app.service-account.email=${SERVICE_ACCOUNT_EMAIL:}
app.service-account.password=${SERVICE_ACCOUNT_PASSWORD:}

# --- CORS: browser origins allowed to call this API (comma separated) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:58020}
