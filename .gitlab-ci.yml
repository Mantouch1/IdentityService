# Secrets (DB password, JWT secret) come from GitLab: Settings > CI/CD > Variables (masked).
# Required variables: CI_DB_PASSWORD, CI_JWT_SECRET (>= 32 characters)
stages:
  - build
  - test

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests -B

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: identityservice_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: $CI_DB_PASSWORD
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identityservice_db
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: $CI_DB_PASSWORD
    SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    JWT_SECRET: $CI_JWT_SECRET
  script:
    - mvn test -B
