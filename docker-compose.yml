services:
  identity-db:
    image: postgres:17
    container_name: identity-db
    environment:
      POSTGRES_DB: identityservice_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"          # 5433 on the host: TenderFlow's Postgres already uses 5432
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d identityservice_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build: .
    container_name: identity-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://identity-db:5432/identityservice_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:58020}
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL:-}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD:-}
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - default
      - platform-net          # shared network: TenderFlow reaches us as http://identity-service:8082

volumes:
  identity_pgdata:

networks:
  platform-net:
    external: true            # create once: docker network create platform-net
